name: PIT Classroom Chat API QA
on:
  push:
    paths:
      - 'pit-game-jam-api/**'
      - '.github/workflows/pit-chat-api-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate API syntax
        run: node --check pit-game-jam-api/api/chat.js
      - name: Test room auth and student conversation isolation
        run: node pit-game-jam-api/test/chat.unit.cjs
