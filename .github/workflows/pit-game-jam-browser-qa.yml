name: PIT Game Jam — Browser QA
on:
  push:
    paths:
      - 'pit-game-jam/**'
      - '.github/workflows/pit-game-jam-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.58.2
      - name: Verify Chrome
        run: google-chrome --version
      - name: Start local static site
        run: python3 -m http.server 8899 --bind 127.0.0.1 > /tmp/pit-site.log 2>&1 &
      - name: Run browser end-to-end test
        run: node pit-game-jam/qa/e2e.cjs
